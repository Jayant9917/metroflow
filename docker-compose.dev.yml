services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: metroflow
      POSTGRES_PASSWORD: metroflow
      POSTGRES_DB: metroflow_core
    ports: ["5432:5432"]
    volumes: ["metroflow-postgres:/var/lib/postgresql/data", "./docker/init-databases.sql:/docker-entrypoint-initdb.d/01-init.sql:ro"]
  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@metroflow.dev
      PGADMIN_DEFAULT_PASSWORD: metroflow-admin
    ports: ["5050:80"]
    depends_on: [postgres]
    volumes: ["metroflow-pgadmin:/var/lib/pgadmin"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  kafka:
    image: bitnamilegacy/kafka:3.9.0-debian-12-r0
    ports: ["9092:9092"]
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      ALLOW_PLAINTEXT_LISTENER: "yes"
volumes:
  metroflow-postgres:
  metroflow-pgadmin:
